name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ローカル開発環境と揃えること（Makefile の setup が案内するバージョン）
  SWIFTFORMAT_VERSION: "0.63.0"
  SWIFTLINT_VERSION: "0.63.2"
  # レイアウト検証は画面幅がいちばん狭い端末で回す。
  # 広い端末で通っても、狭い端末で溢れるのが多言語対応の典型的な壊れ方。
  SIMULATOR: "iPhone SE (3rd generation)"

jobs:
  # 整形・静的解析・ユニットテスト。数分で終わるので早く赤が出る。
  build-and-test:
    name: Build & Test
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # xcconfig は秘匿情報のため git 管理外。CI では example から両方を用意する。
      # project.yml が Debug/Release 両方を参照するので、片方だけだと
      # xcodegen が "Invalid config file" で落ちる。
      - name: Setup xcconfig for CI
        run: |
          cp Config/Debug.xcconfig.example Config/Debug.xcconfig
          cp Config/Release.xcconfig.example Config/Release.xcconfig

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

      # ツールはバージョンを固定する。brew install は常に最新を取るため、
      # コードを変えていないのに新ルールが増えて突然 CI が落ちる
      # （実際に SwiftFormat 0.63.0 の wrapIfStatementBodies で落ちた）。
      # 上げるときはローカルも揃えて、意図的に上げること。
      - name: Install SwiftFormat
        run: |
          curl -sL -o /tmp/swiftformat.zip \
            https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip
          unzip -qo /tmp/swiftformat.zip -d /tmp/swiftformat
          chmod +x /tmp/swiftformat/swiftformat
          sudo mv /tmp/swiftformat/swiftformat /usr/local/bin/swiftformat
          swiftformat --version

      - name: Check format
        run: swiftformat --lint .

      - name: Install SwiftLint
        run: |
          curl -sL -o /tmp/swiftlint.zip \
            https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip
          unzip -qo /tmp/swiftlint.zip -d /tmp/swiftlint
          chmod +x /tmp/swiftlint/swiftlint
          sudo mv /tmp/swiftlint/swiftlint /usr/local/bin/swiftlint
          swiftlint --version

      - name: Lint
        run: swiftlint lint --strict

      # .xcodeproj は生成物なのでリポジトリに含めない（project.yml が正）
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Show environment
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep iPhone

      - name: Build
        run: |
          xcodebuild build \
            -scheme SerendipityPlanner \
            -destination "platform=iOS Simulator,name=${SIMULATOR}" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -scheme SerendipityPlanner \
            -destination "platform=iOS Simulator,name=${SIMULATOR}" \
            -only-testing:SerendipityPlannerTests \
            -resultBundlePath TestResults \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult

  # UI テストは 5言語 × 全画面 × 状態バリエーションを実機起動で回すため長い
  # （ローカルで約15分）。ユニットテストと同じジョブに置くと、
  # 整形ミスの指摘が15分後になる。別ジョブにして並行で回す。
  ui-test:
    name: UI Test
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup xcconfig for CI
        run: |
          cp Config/Debug.xcconfig.example Config/Debug.xcconfig
          cp Config/Release.xcconfig.example Config/Release.xcconfig

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # 並列実行（-parallel-testing-enabled）は試したが**遅くなったので使わない**。
      # ランナー上でシミュレーターを2つ動かすと奪い合いが激しく、
      # 各テストが2〜3倍に伸びて並行の利得を食い潰す。実測は #58 を参照。
      #
      #   起動削減のみ      12m47s  pass
      #   + 並列ワーカー2   18m32s  fail（競合でタイムアウト）
      - name: UI Test
        run: |
          xcodebuild test \
            -scheme SerendipityPlanner \
            -destination "platform=iOS Simulator,name=${SIMULATOR}" \
            -only-testing:SerendipityPlannerUITests \
            -resultBundlePath UITestResults \
            CODE_SIGNING_ALLOWED=NO

      # 失敗時だけでなく常に上げる。5言語ぶんのスクリーンショットが入っており、
      # 切り詰めのような**機械では判定できない崩れ**を人が見るための材料になる。
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UITestResults
          path: UITestResults.xcresult
