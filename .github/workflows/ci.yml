name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # xcconfig は秘匿情報のため git 管理外。CI では example から両方を用意する。
      # project.yml が Debug/Release 両方を参照するので、片方だけだと
      # xcodegen が "Invalid config file" で落ちる。
      - name: Setup xcconfig for CI
        run: |
          cp Config/Debug.xcconfig.example Config/Debug.xcconfig
          cp Config/Release.xcconfig.example Config/Release.xcconfig

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

      - name: Install SwiftFormat
        run: brew install swiftformat

      - name: Check format
        run: swiftformat --lint .

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict

      # .xcodeproj は生成物なのでリポジトリに含めない（project.yml が正）
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Show environment
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep iPhone

      - name: Build
        run: |
          xcodebuild build \
            -scheme SerendipityPlanner \
            -destination 'platform=iOS Simulator,name=iPhone SE (3rd generation)' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -scheme SerendipityPlanner \
            -destination 'platform=iOS Simulator,name=iPhone SE (3rd generation)' \
            -only-testing:SerendipityPlannerTests \
            -resultBundlePath TestResults \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
